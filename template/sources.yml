# Your reading list. Every entry becomes one episode of your feed.
#
# Edit this file (the pencil icon on GitHub works) and commit. The earmark
# Action dictates anything new and publishes it; the Actions tab shows progress
# and, when it is done, your feed URL. Delete an entry to delete its episode.
#
# An entry is a URL, a file you uploaded into files/, or a mapping with
# `source:` plus any of: title, author, date, voice, speed, lang, profile.
# To change the voice or the speed of every entry, edit earmark.toml instead.
# Remove the "# " in front of a line to use it.
#
# - https://example.com/some-article
# - files/a-paper.pdf
# - source: https://example.com/long-read
#   title: A better title
#   voice: bf_emma
#   profile: paper
